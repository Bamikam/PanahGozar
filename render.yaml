# Render Blueprint - PanahGozar (one web service + one managed PostgreSQL).
# Reference: https://render.com/docs/blueprint-spec
#
# The panel is a configuration/credential control plane. Protocol listeners
# cannot run inside a Render web service: inbound public traffic is HTTP(S),
# filesystems are ephemeral, and no UDP/tun/kernel support is exposed. See
# docs/compatibility.md for the full matrix.

services:
  - type: web
    name: panahgozar
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@9.6.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    # Migrations and idempotent reference data run before the release serves.
    preDeployCommand: pnpm release
    startCommand: pnpm start
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true # base64 256-bit value; accepted by the app
      - key: SETUP_TOKEN
        sync: false # prompted on blueprint creation; one-time admin setup
      - key: ENABLE_RUNTIME_LISTENERS
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # PUBLIC_URL is derived from Render's RENDER_EXTERNAL_URL automatically.
      # Set PUBLIC_URL explicitly only when using a custom domain.
      - key: DATABASE_URL
        fromDatabase:
          name: panahgozar-db
          property: connectionString

databases:
  - name: panahgozar-db
    plan: 0.5c-1g
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: [] # private-network connections only
